<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient Hydration Reminder</title>
<meta name="description" content="Software-only hydration tracker and reminder for patients. No hardware needed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Hydration Reminder</h1>
  <button id="settingsBtn" class="ghost" aria-expanded="false" aria-controls="settings">Settings</button>
</header>

<div id="banner" class="banner" role="alert" hidden>
  <span id="bannerText">Time to drink some water.</span>
  <button id="bannerClose" class="ghost">Dismiss</button>
</div>

<main>
  <section class="hero" aria-label="Today's progress">
    <svg id="bottle" viewBox="0 0 120 240" role="img" aria-label="Water bottle showing daily progress">
      <defs><clipPath id="body"><rect x="20" y="40" width="80" height="190" rx="18"/></clipPath></defs>
      <rect x="42" y="8" width="36" height="26" rx="6" class="cap"/>
      <rect x="20" y="40" width="80" height="190" rx="18" class="glass"/>
      <rect id="water" x="20" y="230" width="80" height="0" clip-path="url(#body)" class="water"/>
      <rect x="20" y="40" width="80" height="190" rx="18" class="outline"/>
    </svg>
    <div class="stats">
      <p class="big"><span id="drank">0</span> <small>of <span id="goal">2000</span> ml</small></p>
      <p id="status" class="muted">Loading…</p>
      <p id="next" class="next"></p>
    </div>
  </section>

  <section aria-label="Log water">
    <h2>Log a drink</h2>
    <div class="quick">
      <button data-ml="100">100 ml</button>
      <button data-ml="250">250 ml</button>
      <button data-ml="500">500 ml</button>
    </div>
    <div class="custom">
      <label for="customMl">Other amount (ml)</label>
      <input id="customMl" type="number" min="10" max="1500" step="10" inputmode="numeric">
      <button id="addCustom">Add</button>
    </div>
  </section>

  <section aria-label="Today's log">
    <div class="row"><h2>Today</h2><button id="undo" class="ghost">Undo last</button></div>
    <ul id="log" class="log"></ul>
  </section>

  <section id="settings" class="panel" hidden aria-label="Settings">
    <h2>Settings</h2>
    <label>Patient name <input id="sName" type="text" maxlength="40"></label>
    <label>Daily goal (ml) <input id="sGoal" type="number" min="500" max="5000" step="100"></label>
    <label>Remind every (minutes) <input id="sInterval" type="number" min="15" max="240" step="5"></label>
    <div class="pair">
      <label>Awake from <input id="sStart" type="time"></label>
      <label>Until <input id="sEnd" type="time"></label>
    </div>
    <button id="save">Save settings</button>
    <button id="enableNotif" class="ghost">Turn on notifications</button>
    <button id="reset" class="danger">Clear all data</button>
    <p class="muted small">Follow your doctor's fluid advice. Some conditions need a fluid limit, so set the goal they give you.</p>
  </section>
</main>

<footer>Not a medical device. Data stays in this browser.</footer>
<script src="app.js"></script>
</body>
</html>
